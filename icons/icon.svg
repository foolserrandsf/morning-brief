<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="80%">
      <stop offset="0" stop-color="#3B4E7E"/>
      <stop offset="0.55" stop-color="#25335A"/>
      <stop offset="1" stop-color="#1A2340"/>
    </radialGradient>
    <linearGradient id="mug" x1="0" x2="1">
      <stop offset="0" stop-color="#D65A2E"/>
      <stop offset="0.45" stop-color="#EE7C4E"/>
      <stop offset="1" stop-color="#C24D25"/>
    </linearGradient>
    <radialGradient id="crema" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#E9B27A"/>
      <stop offset="0.6" stop-color="#C98547"/>
      <stop offset="1" stop-color="#8A4E22"/>
    </radialGradient>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- sun rays -->
  <g fill="#F4C9A8" opacity="0.12">
    <circle cx="256" cy="150" r="118"/>
  </g>
  <!-- steam -->
  <g fill="none" stroke="url(#steam)" stroke-width="20" stroke-linecap="round">
    <path d="M196 214 C176 180 216 160 196 124 C182 98 200 80 206 70"/>
    <path d="M256 210 C236 172 278 150 256 110 C242 84 262 62 268 50"/>
    <path d="M316 214 C296 180 336 160 316 124 C302 98 320 80 326 70"/>
  </g>
  <!-- saucer -->
  <ellipse cx="248" cy="430" rx="190" ry="38" fill="#0E1426" opacity="0.5"/>
  <ellipse cx="248" cy="418" rx="184" ry="36" fill="#FFFDF7"/>
  <ellipse cx="248" cy="414" rx="120" ry="20" fill="#F1E6D6"/>
  <!-- handle -->
  <path d="M356 278 C430 270 440 370 352 378" fill="none" stroke="#C24D25" stroke-width="34" stroke-linecap="round"/>
  <path d="M356 278 C430 270 440 370 352 378" fill="none" stroke="#EE7C4E" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <!-- mug body -->
  <path d="M120 248 L376 248 L362 384 C358 410 332 424 300 424 L196 424 C164 424 138 410 134 384 Z" fill="url(#mug)"/>
  <path d="M150 268 C146 320 152 370 166 404" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" opacity="0.35"/>
  <!-- rim + coffee -->
