  <ellipse cx="248" cy="250" rx="112" ry="22" fill="url(#crema)"/>
  <path d="M248 262 C226 250 222 240 232 236 C240 233 246 237 248 242 C250 237 256 233 264 236 C274 240 270 250 248 262 Z" fill="#FFF1DC"/>
