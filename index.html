<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morning Brief</title>
<meta name="theme-color" content="#F2F4F7">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Morning">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600;700&family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* morning light: porcelain, indigo ink, one persimmon accent */
  --bg:#F2F4F7; --paper:#FFFFFF; --ink:#1D2740; --soft:#5E6678; --line:#E2E6EC; --wash:#F7F8FA;
  --indigo:#1D2740; --ai:#3070D0; --persimmon:#EC6A3A; --persimmon-wash:#FFEDE3;
  --sage:#2F9460; --sage-wash:#E4F4EA; --plum:#B3366A; --teal:#17998C; --ochre:#D29A1B; --slate:#6A57D6;
  --display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
  --sun2:var(--persimmon); --sky:var(--ai); --coral:var(--persimmon); --grape:var(--slate); --leaf:var(--sage); --rose:var(--plum);
  --ok:#3E8A5E; --bad:#C8453A; --r:16px;
  --sans:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --mincho:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(900px 420px at 15% -120px,rgba(255,182,140,.42),transparent 70%),radial-gradient(800px 380px at 100% -160px,rgba(120,170,255,.30),transparent 70%);background-repeat:no-repeat}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em}
a{color:var(--ai);text-underline-offset:3px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top img{width:36px;height:36px;border-radius:9px}
.top .t{flex:1;min-width:0}
.top .t b{display:flex;align-items:baseline;gap:7px;flex-wrap:nowrap;white-space:nowrap;font:700 18px/1.2 var(--display)}
.top .t b em{font-style:normal;font-weight:500;font-size:15px;color:var(--persimmon);font-family:var(--sans)}
.top .t span{color:var(--soft);font-size:13.5px}
.top .t b{white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--persimmon)}
#syncchip{color:var(--soft);font-weight:500}
.iconbtn{background:var(--paper);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:17px;display:grid;place-items:center;color:var(--soft)}
.modes{display:flex;gap:2px;margin:0 0 14px;background:#E6E9EF;border-radius:11px;padding:3px}
.modes button{flex:1;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--soft)}
.modes button.on{background:var(--ink);color:#fff}
.bar{display:flex;gap:3px;margin:0 0 14px}
.bar i{flex:1;height:6px;border-radius:6px;background:#DCE1E8;transition:background .3s}
.bar i.now{background:var(--ink)}
.card{background:var(--paper);border-radius:20px;padding:20px 18px 18px;border:1px solid rgba(29,39,64,.06);box-shadow:0 10px 28px rgba(29,39,64,.08);position:relative;overflow:hidden;animation:enter .22s ease-out}
@keyframes enter{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.card .band{position:absolute;left:0;top:0;right:0;height:5px}
.card .hd{display:flex;gap:12px;align-items:center;margin:4px 0 12px}
.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none}
.ic.k{font:700 23px var(--mincho)}
.card h2{margin:0;font-size:23px;line-height:1.15;font-weight:700}
.card .sub{color:var(--soft);font-size:14px;margin-top:3px}
.card p{margin:.5em 0}
.card ul{margin:.3em 0;padding-left:1.15em}.card li{margin:.25em 0}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--paper)}
.item .k{font-weight:600}
.item .m{color:var(--soft);font-size:14.5px}
.item.news{padding:13px 14px}
.nsum{margin:.45em 0;font-size:15.5px;line-height:1.55}
.nwhy{background:#F1EEFC;border-radius:9px;padding:8px 10px;margin-top:8px;font-size:14.5px}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;margin:0 4px 3px 0;background:var(--wash);color:var(--soft);border:1px solid var(--line)}
.empty{color:var(--soft)}
.foot{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border-radius:14px;padding:14px 10px;font-weight:700;font-size:16.5px;background:var(--sage);color:#fff;box-shadow:0 3px 0 #237449;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #237449}
.btn.ghost{flex:0 0 auto;padding:14px 18px;background:var(--paper);color:var(--soft);border:1px solid var(--line);box-shadow:0 3px 0 #E2E6EC}
.btn.sun{background:var(--persimmon);box-shadow:0 3px 0 #C4532A}
.btn.ink{background:var(--ink);box-shadow:0 3px 0 #0F1528}
.big{font:700 29px/1.15 var(--display);letter-spacing:-.02em;margin:.1em 0 .4em}
.focus{background:var(--persimmon-wash);border-radius:14px;padding:15px;margin:6px 0 16px}
.focus .lbl{font-size:14px;font-weight:600;color:var(--persimmon)}
.focus .one{font:700 21px/1.25 var(--display);margin:4px 0 6px}
.focus{border:1px solid #FFD9C6}
.focus .btn{flex:0 0 auto;padding:11px 16px;font-size:15px}
.wx{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.wx .temp{font:700 36px var(--display);letter-spacing:-.02em;color:var(--ai)}
.kanji{font:600 132px/1 var(--mincho);text-align:center;margin:10px 0 6px;color:var(--ink)}
.jp{font-family:var(--mincho)}
.center{text-align:center}
.label{width:100%;max-height:340px;object-fit:contain;background:var(--wash);border-radius:12px;display:block;margin:6px 0 12px}
.terms{display:grid;gap:6px;margin:10px 0}
.terms div{background:var(--wash);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:15px}
.hook{background:#EEF4FD;border-left:4px solid var(--ai);border-radius:10px;padding:10px 12px;margin:12px 0;font-weight:600}
.quiz{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.quiz h3{margin:0 0 4px;font-size:17px}
.q{margin:14px 0}
.q .qt{font-weight:600;margin-bottom:8px}
.q img{width:100%;max-height:220px;object-fit:contain;background:var(--wash);border-radius:10px;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid #D5DAE2;border-radius:10px;padding:11px 13px;margin:6px 0;font-weight:500;color:var(--ink)}
.opt.right{background:var(--sage-wash);border-color:var(--ok)}
.opt.wrong{background:#FBEAE8;border-color:var(--bad)}
.why{font-size:14.5px;background:var(--wash);border-radius:10px;padding:9px 11px;margin-top:6px;color:var(--ink)}
.score{font-weight:600;margin-top:8px}
.ov{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ov button{background:var(--paper);border-radius:12px;padding:13px 12px;text-align:left;border:1px solid var(--line);min-height:84px;position:relative}
.ov button.done{background:var(--sage-wash);border-color:#CFE3D6}
.ov .e{display:block;width:8px;height:8px;border-radius:50%}
.ov .n{font-weight:600;font-size:15px;line-height:1.25;display:block;margin-top:8px}.ov .m{font-size:13px;color:var(--soft)}
.lock{min-height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.lock img{width:96px;height:96px;border-radius:22px}
.lock h1{font-weight:600;font-size:26px}
.lock input{width:100%;max-width:340px;font:500 18px var(--sans);padding:13px;border-radius:12px;border:1px solid #CDD3DC;text-align:center;background:#fff;color:var(--ink)}
.lock .btn{max-width:340px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;z-index:9;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.timer{font-weight:600;font-size:40px;text-align:center;margin:8px 0 0;font-variant-numeric:tabular-nums;color:var(--persimmon)}
.fb{border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.fb .mu{font-weight:600;font-size:16.5px}
.fb .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fb .chip{color:var(--ink);font-weight:500;font-size:13.5px}
.bet{background:var(--persimmon-wash);border-radius:8px;padding:6px 9px;margin-top:7px;font-weight:600;font-size:14px}
.pick{background:#EAF0F8;border-radius:8px;padding:6px 9px;margin-top:7px;font-size:14px}
.done-wrap{text-align:center;padding:30px 10px}
.prog{display:grid;gap:8px;margin-top:10px}
.prog .row{display:flex;align-items:center;gap:8px;font-weight:500;font-size:15px}
.prog .track{flex:1;height:6px;background:#E4E8EE;border-radius:6px;overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--sage)}
.small{font-size:14px;color:var(--soft)}
.src{font-size:13px;color:var(--soft);margin-top:12px}
.src a{color:var(--soft)}
.jpnote{display:grid;gap:5px;margin-top:8px}
.jpnote div{font-size:14.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:8}
ruby{ruby-position:under;-webkit-ruby-position:after;ruby-align:center}
rt{font:500 .52em/1.1 var(--sans);color:var(--soft);letter-spacing:.02em}
.card p,.item,.q,.why,.jpnote div{line-height:1.75}
details.past{margin-top:10px}
details.past summary{font-weight:600;cursor:pointer}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script>
var APP_BUILD='20261010090615';
var START='2026-10-09';            // day 0 — recall quizzes run every other day from here
var S={brief:null,state:null,key:null,i:0,mode:'flow',cards:[],quick:false};
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ls(k,v){try{if(v===undefined){var x=localStorage.getItem(k);return x?JSON.parse(x):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on')},2200)}
function todayPT(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles'}).format(new Date())}
function dayIdx(d){return Math.round((Date.parse(d)-Date.parse(START))/864e5)}
function shortDate(d){var x=new Date(d+'T12:00:00');return x.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function prettyDate(d){var x=new Date(d+'T12:00:00');return x.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}
function linkify(u,t){return u?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(t||'Open')+'</a>':''}

/* ---------- crypto ---------- */
function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function b64e(u){var s='';u=new Uint8Array(u);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
async function deriveKey(pass){
  var sj=await (await fetch('data/salt.json',{cache:'no-store'})).json();
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(sj.salt),iterations:sj.iter,hash:'SHA-256'},base,256);
  return b64e(bits);
}
async function importKey(raw){S.raw=raw;return crypto.subtle.importKey('raw',b64d(raw),'AES-GCM',false,['encrypt','decrypt'])}
async function decFile(path,v){
  var r=await fetch(path+'?v='+v,{cache:'no-store'});if(!r.ok)throw new Error('missing '+path);
  var j=await r.json();
  var p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(j.n)},S.key,b64d(j.c));
  return JSON.parse(new TextDecoder().decode(p));
}

/* ---------- progress (synced across devices) ---------- */
var P=ls('mb_prog')||{};          // itemId -> {box, wrong, last, t}
var DONE=ls('mb_done')||{};       // date -> {cardId: timestamp}
function record(id,right){
  var p=P[id]||{box:0,wrong:0,last:null};
  if(right){p.box=Math.min(4,p.box+1)}else{p.box=0;p.wrong++}
  p.last=todayPT();p.t=Date.now();P[id]=p;ls('mb_prog',P);queueSync();
}

/* Sync: progress is encrypted on the phone with the same key as the brief, then stored as
   ciphertext in Denise's "Morning Brief Sync" Google Sheet through its Apps Script web app. */
var SY={rev:0,timer:null,state:'off',dirty:false};
function syncURL(){return window.MB_SYNC_URL||''}
async function syncToken(){
  var a=b64d(S.raw),b=new TextEncoder().encode('mb-sync'),u=new Uint8Array(a.length+b.length);u.set(a);u.set(b,a.length);
  var h=new Uint8Array(await crypto.subtle.digest('SHA-256',u));
  return Array.prototype.map.call(h,function(x){return ('0'+x.toString(16)).slice(-2)}).join('');
}
async function encBlob(o){
  var n=crypto.getRandomValues(new Uint8Array(12));
  var c=await crypto.subtle.encrypt({name:'AES-GCM',iv:n},S.key,new TextEncoder().encode(JSON.stringify(o)));
  return JSON.stringify({n:b64e(n),c:b64e(c)});
}
async function decBlob(s){var j=JSON.parse(s);var p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(j.n)},S.key,b64d(j.c));return JSON.parse(new TextDecoder().decode(p))}
function mergeIn(r){
  var changed=false;
  Object.keys(r.P||{}).forEach(function(id){var x=r.P[id],y=P[id];if(!y||(x.t||0)>(y.t||0)){P[id]=x;changed=true}});
  Object.keys(r.DONE||{}).forEach(function(d){var x=r.DONE[d],y=DONE[d]=DONE[d]||{};Object.keys(x).forEach(function(c){if(!y[c]){y[c]=x[c];changed=true}})});
  ls('mb_prog',P);ls('mb_done',DONE);return changed;
}
function pruneDone(){var cut=new Date(Date.now()-120*864e5).toISOString().slice(0,10);Object.keys(DONE).forEach(function(d){if(d<cut)delete DONE[d]})}
function syncLabel(){return {off:'',ok:'· synced',busy:'· saving',err:'· offline'}[SY.state]||''}
function setSync(st){SY.state=st;var e=$('syncchip');if(e)e.textContent=syncLabel()}
/* every sync step runs one at a time, so quick answers never race each other */
var SQ=Promise.resolve();
function serial(fn){var r=SQ.then(fn,fn);SQ=r.catch(function(){});return r}
function pull(){return serial(pullNow)}
async function pullNow(){
  if(!syncURL()||!S.raw)return false;
  setSync('busy');
  var r=await (await fetch(syncURL()+'?token='+(await syncToken())+'&t='+Date.now())).json();
  if(!r.ok)throw new Error(r.error||'sync');
  SY.rev=r.rev||0;
  var changed=false,localExtra;
  if(r.blob){
    var remote=await decBlob(r.blob);changed=mergeIn(remote);
    localExtra=Object.keys(P).some(function(id){var x=(remote.P||{})[id];return !x||(P[id].t||0)>(x.t||0)})||
      Object.keys(DONE).some(function(d){return Object.keys(DONE[d]).some(function(c){return !((remote.DONE||{})[d]||{})[c]})});
  }else localExtra=Object.keys(P).length>0||Object.keys(DONE).length>0;
  setSync(SY.dirty?'busy':'ok');
  if(localExtra)queueSync(10);
  return changed;
}
function push(){clearTimeout(SY.timer);return serial(pushNow)}
async function pushNow(){
  if(!syncURL()||!S.raw)return;
  setSync('busy');
  try{
    for(var tries=0;tries<4;tries++){
      pruneDone();SY.dirty=false;
      var body=JSON.stringify({token:await syncToken(),base:SY.rev,blob:await encBlob({P:P,DONE:DONE,at:Date.now()})});
      var r=await (await fetch(syncURL(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body,keepalive:body.length<60000})).json();
      if(r.ok){SY.rev=r.rev;SY.fails=0;setSync(SY.dirty?'busy':'ok');return}
      if(!r.conflict)throw new Error(r.error||'sync');
      await pullNow();            // someone else saved first: merge theirs, then try again
    }
    throw new Error('conflict');
  }catch(e){
    SY.dirty=true;SY.fails=(SY.fails||0)+1;
    setSync(SY.fails>2?'err':'busy');      // quiet retries first; only warn if it keeps failing
    clearTimeout(SY.timer);SY.timer=setTimeout(push,Math.min(60000,3000*SY.fails));
  }
}
/* ---------- morning notifications from the mug icon ---------- */
function pushState(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!window.MB_PUSH_KEY||!syncURL())return 'unsupported';
  var standalone=window.navigator.standalone||window.matchMedia('(display-mode: standalone)').matches;
  if(!standalone)return 'install';
  if(Notification.permission==='denied')return 'denied';
  return ls('mb_push')?'on':'off';
}
async function enablePush(){
  try{
    var perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Notifications are off — you can allow them in Settings → Notifications.');render();return}
    var reg=await navigator.serviceWorker.ready;
    var sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64urlBytes(window.MB_PUSH_KEY)});
    var r=await (await fetch(syncURL(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:await syncToken(),sub:sub.toJSON()})})).json();
    if(!r.ok)throw new Error(r.error||'save');
    ls('mb_push',1);toast('Morning notifications are on');render();
  }catch(e){toast('Couldn\'t turn on notifications — try again in a minute.')}
}
function b64urlBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return b64d(s)}
function pushPanel(){
  var st=pushState();
  if(st==='on')return '<p class="small" style="margin-top:12px">Morning notifications are on for this phone.</p>';
  if(st==='off')return '<div class="foot" style="margin-top:12px"><button class="btn sun" onclick="enablePush()">Turn on morning notifications</button></div><p class="small">You\'ll get one notification from this app when your brief is ready, around 6:30.</p>';
  if(st==='install')return '<p class="small" style="margin-top:12px">To get morning notifications from this app, open it from its home-screen icon (Share → Add to Home Screen in Safari).</p>';
  if(st==='denied')return '<p class="small" style="margin-top:12px">Notifications are blocked for this app. Turn them on in iPhone Settings → Notifications → Morning Brief.</p>';
  return '';
}
function queueSync(ms){if(!syncURL())return;SY.dirty=true;clearTimeout(SY.timer);SY.timer=setTimeout(push,ms==null?1500:ms)}

function mastered(id){return (P[id]||{}).box>=3}

/* ---------- unlock ---------- */
function lockScreen(msg){
  $('app').innerHTML='<div class="lock"><img src="icons/icon-512.png" alt=""><h1 style="margin:6px 0 0">Good morning, Denise</h1>'+
  '<p class="small" style="max-width:320px">'+(msg?esc(msg):'Type your passphrase once and this phone remembers it.')+'</p>'+
  '<input id="pass" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="passphrase">'+
  '<button class="btn sun" id="go">Unlock my morning</button></div>';
  var go=async function(){
    var v=$('pass').value.trim().toLowerCase();if(!v)return;
    $('go').textContent='Brewing…';
    try{var raw=await deriveKey(v);S.key=await importKey(raw);await load(true);ls('mb_key',raw);syncNow()}
    catch(e){S.key=null;lockScreen('That passphrase didn\'t open it. Try again (dashes included).')}
  };
  $('go').onclick=go;$('pass').onkeydown=function(e){if(e.key==='Enter')go()};
}

/* ---------- load ---------- */
async function load(first,date){
  var lt=await (await fetch('data/latest.json?'+Date.now(),{cache:'no-store'})).json();
  var d=date||lt.date;
  S.state=await decFile('data/state.enc',lt.v);
  S.brief=await decFile('data/briefs/'+d+'.enc',lt.v);
  S.latest=lt;
  ls('mb_cache',{brief:S.brief,state:S.state,latest:lt});
  build();
}
async function boot(){

var QN=0;
function quizHTML(items,title,onDoneKey){
  if(!items||!items.length)return '';
  var id='qz'+(QN++);
  window['_'+id]=items;
  var h='<div class="quiz" id="'+id+'" data-done="'+(onDoneKey||'')+'"><h3>'+esc(title||'Quick check')+'</h3>';
  items.forEach(function(q,i){
    h+='<div class="q" data-i="'+i+'">'+(q.img?'<img loading="lazy" src="'+esc(q.img)+'" alt="">':'')+
      '<div class="qt">'+(i+1)+'. '+esc(q.q)+'</div>';
    q.o.forEach(function(o,j){h+='<button class="opt" data-j="'+j+'">'+esc(o)+'</button>'});
    h+='</div>';
  });
  return h+'<div class="score"></div></div>';
}
function wireQuizzes(root){
  root.querySelectorAll('.quiz').forEach(function(z){
    var items=window['_'+z.id];var answered=0,right=0;
    z.querySelectorAll('.q').forEach(function(qd){
      var q=items[+qd.dataset.i];
      qd.querySelectorAll('.opt').forEach(function(b){
        b.onclick=function(){
          if(qd.dataset.ans)return;qd.dataset.ans=1;
          var j=+b.dataset.j,ok=j===q.a;
          b.classList.add(ok?'right':'wrong');
          if(!ok)qd.querySelectorAll('.opt')[q.a].classList.add('right');
          if(q.w){var w=document.createElement('div');w.className='why';w.innerHTML=esc(q.w);qd.appendChild(w);furi(w)}
          if(q.id)record(q.id,ok);
          answered++;if(ok)right++;
          if(navigator.vibrate)navigator.vibrate(ok?15:[30,40,30]);
          if(answered===items.length){
            z.querySelector('.score').textContent=right===items.length?right+'/'+items.length+' — perfect.':right+'/'+items.length+' — misses come back in your next quiz.';
            if(right===items.length)burst(40);
          }
        };
      });
    });
  });
}
function withIds(sec,track){
  // lesson quiz items carry the same ids the publisher stored, so answers feed the recall pool
  var pool=(S.state&&S.state.pool)||{};
  return (sec.quiz||[]).map(function(q){
    for(var k in pool){var p=pool[k];if(p.track===track&&p.q===q.q&&p.date===S.brief.date)return Object.assign({},q,{id:p.id})}
    return q;
  });
}
function recallItems(kind){
  var pool=Object.values((S.state&&S.state.pool)||{}),d=S.brief.date;
  if(kind==='sunday'){
    var wk=Date.parse(d)-7*864e5;
    return shuffle(pool.filter(function(p){return p.track==='kanji'&&Date.parse(p.date)>wk&&p.date<=d})).slice(0,14);
  }
  var older=pool.filter(function(p){return p.date<d&&!mastered(p.id)});
  var missed=older.filter(function(p){return (P[p.id]||{}).wrong>0});
  if(kind==='second')return shuffle(missed).slice(0,5);
  missed.sort(function(a,b){return ((P[b.id]||{}).wrong||0)-((P[a.id]||{}).wrong||0)});
  var rest=older.filter(function(p){return missed.indexOf(p)<0}).sort(function(a,b){return a.date<b.date?-1:1});
  // bottles + WSET lead the recall quiz; language, kanji and markets fill in
  var lead=rest.filter(function(p){return p.track==='bottle'||p.track==='wset'});
  var fill=rest.filter(function(p){return lead.indexOf(p)<0});
  return missed.slice(0,4).concat(lead.slice(0,4),fill).slice(0,10);
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- furigana: {漢字|かんじ} → kana under kanji she hasn't learned ---------- */
var NUMK='一二三四五六七八九十百千万';
function learnedSet(){
  var set={},d=S.brief&&S.brief.date;
  NUMK.split('').forEach(function(c){set[c]=1});
  ((S.state&&S.state.taught&&S.state.taught.kanji)||[]).forEach(function(x){if(!d||x.date<=d)(x.ref||'').replace(/[\u4e00-\u9fff]/g,function(c){set[c]=1})});
  return set;
}
function furi(root){
  if(!root)return;var have=learnedSet(),re=/\{([^{}|]+)\|([^{}]*)\}/g;
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),nodes=[],n;
  while(n=w.nextNode()){if(n.nodeValue.indexOf('{')>-1&&n.nodeValue.indexOf('|')>-1)nodes.push(n)}
  nodes.forEach(function(t){
    var txt=t.nodeValue,frag=document.createDocumentFragment(),last=0,m;re.lastIndex=0;
    while(m=re.exec(txt)){
      if(m.index>last)frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
      var base=m[1],rd=m[2],need=rd&&rd!=='-'&&(base.match(/[\u4e00-\u9fff\u3005]/g)||[]).some(function(c){return !have[c]});
      if(need){var r=document.createElement('ruby');r.appendChild(document.createTextNode(base));var rt=document.createElement('rt');rt.textContent=rd;r.appendChild(rt);frag.appendChild(r)}
      else frag.appendChild(document.createTextNode(base));
      last=re.lastIndex;
    }
    if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last)));
    t.parentNode.replaceChild(frag,t);
  });
}

function build(){
  QN=0;S.cards=buildCards();
  var done=DONE[S.brief.date]||{};
  if(S.i>=S.cards.length||S.i<0)S.i=0;
  // land on the first card not done yet
  if(!S._landed){S._landed=1;for(var i=0;i<S.cards.length;i++){if(!done[S.cards[i].id]){S.i=i;break}}}
  render();
}

function streak(){
  var n=0,d=new Date(todayPT()+'T12:00:00');
  for(;;){var k=d.toISOString().slice(0,10),x=DONE[k];if(x&&Object.keys(x).length>=3){n++;d.setDate(d.getDate()-1)}else break}
  return n;
}

  var cs=visible(),done=DONE[S.brief.date]||{},n=cs.filter(function(c){return done[c.id]}).length,mins=cs.filter(function(c){return !done[c.id]}).reduce(function(a,c){return a+(c.min||1)},0);

  return '<div class="top"><img src="icons/icon-192.png" alt=""><div class="t"><b>Morning Brief <em>'+esc(shortDate(S.brief.date))+'</em></b><span>'+n+'/'+cs.length+' done · '+mins+' min left'+(stale?' · from '+esc(S.brief.date):'')+' <span id="syncchip">'+syncLabel()+'</span></span></div>'+(streak()?'<span class="chip" title="Days in a row">🔥 '+streak()+'</span>':'')+'<button class="iconbtn" aria-label="Refresh" onclick="refresh()">↻</button></div>'+
  '<div class="modes"><button class="'+(S.mode==='flow'&&!S.quick?'on':'')+'" onclick="setMode(\'flow\',false)">One at a time</button><button class="'+(S.quick?'on':'')+'" onclick="setMode(\'flow\',true)">2-min musts</button><button class="'+(S.mode==='all'?'on':'')+'" onclick="setMode(\'all\',false)">Overview</button></div>';
}
function render(){
  var app=$('app'),cs=visible(),done=DONE[S.brief.date]||{};
  if(S.mode==='all'){
    app.innerHTML=header()+'<div class="ov">'+S.cards.map(function(c,i){return '<button class="'+(done[c.id]?'done':'')+'" onclick="jump('+i+')"><span class="ic'+(c.id==='kanji'?' k':'')+'" style="width:34px;height:34px;font-size:17px;border-radius:10px;background:'+tint(c.color)+';color:'+c.color+'">'+(ICON[c.id]||'•')+'</span><span class="n">'+esc(c.title)+'</span><span class="m">'+(done[c.id]?'Done':'~'+c.min+' min')+'</span></button>'}).join('')+'</div>'+extras();furi(app);
    return;
  }
  if(S.i>=cs.length){finish();return}
  var c=cs[S.i];
  app.innerHTML=header()+'<div class="bar">'+cs.map(function(x,i){return '<i class="'+(i===S.i&&!done[x.id]?'now':'')+'"'+(done[x.id]?' style="background:'+x.color+'"':'')+'></i>'}).join('')+'</div>'+card(c)+
    '<div class="foot"><button class="btn ghost" onclick="later()">Later ↷</button><button class="btn" onclick="gotIt()">'+(S.i===cs.length-1?'Finish':'Got it')+'</button></div>'+
    (S.i>0?'<p class="center"><a href="#" onclick="S.i--;render();return false">← back</a></p>':'');
  furi(app);wireQuizzes(app);tickJST();window.scrollTo({top:0,behavior:'smooth'});
}
function extras(){
  var st=S.state||{},pool=Object.values(st.pool||{});
  var rows=Object.keys(TRACK_NAME).map(function(t){var all=pool.filter(function(p){return p.track===t}),m=all.filter(function(p){return mastered(p.id)}).length;return '<div class="row"><span style="width:118px">'+TRACK_NAME[t]+'</span><span class="track"><i style="width:'+(all.length?Math.round(m/all.length*100):0)+'%"></i></span><span class="small">'+m+'/'+all.length+'</span></div>'}).join('');
  var past=(st.dates||[]).slice().reverse().map(function(d){return '<a href="#" style="display:inline-block;margin:4px 10px 4px 0" onclick="openDay(\''+d+'\');return false">'+esc(d)+'</a>'}).join('');
  var src=(S.brief.sources||[]).map(function(s){return linkify(s.url,s.title)}).join(' · ');
  return '<div class="card" style="margin-top:14px"><h2>Your progress</h2><p class="small">Quiz questions mastered (3 right in a row). '+(syncURL()?(SY.state==='err'?'Sync couldn\'t reach Google — answers are saved here and sync when it can.':'Synced across your devices.'):'Sync isn\'t switched on yet — progress is saved on this device only.')+'</p><div class="prog">'+rows+'</div>'+
    pushPanel()+'<details class="past"><summary>Past briefs</summary>'+past+'</details>'+(src?'<div class="src">Sources: '+src+'</div>':'')+
    '<p class="small" style="margin-top:12px"><a href="#" onclick="if(confirm(\'Lock this phone? You\\\'ll need the passphrase again.\')){localStorage.removeItem(\'mb_key\');location.reload()}return false">Lock this phone</a></p></div>';
}
function setMode(m,q){S.mode=m;S.quick=q;S.i=0;var done=DONE[S.brief.date]||{},cs=visible();for(var i=0;i<cs.length;i++){if(!done[cs[i].id]){S.i=i;break}}render()}
function jump(i){S.touched=1;S.mode='flow';S.quick=false;S.i=i;render()}
function mark(){var cs=visible(),c=cs[S.i];var d=DONE[S.brief.date]=DONE[S.brief.date]||{};if(!d[c.id]){d[c.id]=Date.now();ls('mb_done',DONE);queueSync()}}
function gotIt(){S.touched=1;mark();burst(10);S.i++;render()}
function later(){S.touched=1;var cs=visible();if(S.quick){S.i++;render();return}var c=S.cards.splice(S.cards.indexOf(cs[S.i]),1)[0];S.cards.push(c);render();toast('Saved it for later')}
function finish(){
  var done=DONE[S.brief.date]||{},left=S.cards.filter(function(c){return !done[c.id]});
  burst(160);
  $('app').innerHTML=header()+'<div class="card done-wrap"><img src="icons/icon-192.png" alt="" style="width:72px;height:72px;border-radius:16px;margin-bottom:6px"><div class="big">'+(left.length?'Musts done!':'Brief complete!')+'</div><p>'+(left.length?left.length+' cards are waiting whenever you want them.':'You showed up for yourself this morning. That counts.')+'</p><div class="foot">'+(left.length?'<button class="btn sun" onclick="setMode(\'flow\',false)">Keep going</button>':'')+'<button class="btn ink" onclick="setMode(\'all\',false)">Overview</button></div></div>'+extras();furi($('app'));
}
async function openDay(d){try{S.brief=await decFile('data/briefs/'+d+'.enc',S.latest.v);S._landed=0;S.mode='flow';S.quick=false;build()}catch(e){toast('Couldn\'t open that day')}}
async function refresh(){toast('Checking for a fresh brief…');try{S._landed=0;await load();toast('Up to date')}catch(e){toast('Offline — try again soon')}}
function tickJST(){var e=$('jst');if(!e)return;e.textContent=new Date().toLocaleTimeString('en-US',{timeZone:'Asia/Tokyo',hour:'numeric',minute:'2-digit'})}
setInterval(tickJST,30000);
var SPR=null;
function sprint(){
  var el=$('sprint');if(!el)return;clearInterval(SPR);var end=Date.now()+300000;
  var t=function(){var s=Math.max(0,Math.round((end-Date.now())/1000));el.innerHTML='<div class="timer">'+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'</div>';if(!s){clearInterval(SPR);el.innerHTML='<div class="timer">Sprint done.</div>';burst(80);if(navigator.vibrate)navigator.vibrate([80,60,80])}};
  t();SPR=setInterval(t,1000);
}
/* confetti */
function burst(n){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cv=$('confetti'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  var cols=['#EC6A3A','#3070D0','#2F9460','#D29A1B','#B3366A','#6A57D6','#17998C'],ps=[];
  for(var i=0;i<n;i++)ps.push({x:innerWidth/2,y:innerHeight*.7,vx:(Math.random()-.5)*14,vy:-Math.random()*16-6,c:cols[i%cols.length],s:Math.random()*7+4,r:Math.random()*6});
  var f=0;(function a(){x.clearRect(0,0,cv.width,cv.height);ps.forEach(function(p){p.vy+=.5;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<90)requestAnimationFrame(a);else x.clearRect(0,0,cv.width,cv.height)})();
}
/* updates: new build → reload shell */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
document.addEventListener('visibilitychange',function(){if(document.hidden&&SY.dirty){push()}if(!document.hidden&&S.key){syncNow()}if(!document.hidden&&S.latest){fetch('data/latest.json?'+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(lt){if(lt.v!==S.latest.v){S._landed=0;load()}}).catch(function(){})}});
boot();
</script>
