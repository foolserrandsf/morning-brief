<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morning Brief</title>
<meta name="theme-color" content="#F2F4F7">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Morning">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600;700&family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* morning light: porcelain, indigo ink, one persimmon accent */
  --bg:#F2F4F7; --paper:#FFFFFF; --ink:#1D2740; --soft:#5E6678; --line:#E2E6EC; --wash:#F7F8FA;
  --indigo:#1D2740; --ai:#3070D0; --persimmon:#EC6A3A; --persimmon-wash:#FFEDE3;
  --sage:#2F9460; --sage-wash:#E4F4EA; --plum:#B3366A; --teal:#17998C; --ochre:#D29A1B; --slate:#6A57D6;
  --display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
  --sun2:var(--persimmon); --sky:var(--ai); --coral:var(--persimmon); --grape:var(--slate); --leaf:var(--sage); --rose:var(--plum);
  --ok:#3E8A5E; --bad:#C8453A; --r:16px;
  --sans:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --mincho:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(900px 420px at 15% -120px,rgba(255,182,140,.42),transparent 70%),radial-gradient(800px 380px at 100% -160px,rgba(120,170,255,.30),transparent 70%);background-repeat:no-repeat}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em}
a{color:var(--ai);text-underline-offset:3px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top img{width:36px;height:36px;border-radius:9px}
.top .t{flex:1;min-width:0}
.top .t b{display:flex;align-items:baseline;gap:7px;flex-wrap:nowrap;white-space:nowrap;font:700 18px/1.2 var(--display)}
.top .t b em{font-style:normal;font-weight:500;font-size:15px;color:var(--persimmon);font-family:var(--sans)}
.top .t span{color:var(--soft);font-size:13.5px}
.top .t b{white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--persimmon)}
#syncchip{color:var(--soft);font-weight:500}
.iconbtn{background:var(--paper);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:17px;display:grid;place-items:center;color:var(--soft)}
.modes{display:flex;gap:2px;margin:0 0 14px;background:#E6E9EF;border-radius:11px;padding:3px}
.modes button{flex:1;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--soft)}
.modes button.on{background:var(--ink);color:#fff}
.bar{display:flex;gap:3px;margin:0 0 14px}
.comehead{font-size:16.5px;margin:16px 0 8px}.coming{display:grid;gap:8px}.cu{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--paper)}.cd{flex:0 0 58px;text-align:center;border-radius:10px;background:#E4F1FF;color:#2E6FD6;padding:4px 0;line-height:1.15}.cd b{display:block;font-size:13px;letter-spacing:.02em}.cd span{font-size:16px;font-weight:700}.cw{font-size:16px;font-weight:600}.ci{margin-right:8px}

.play{margin:12px 0;padding:10px;border:1px solid var(--line);border-radius:12px;background:#F4F9F2;color:var(--ink)}.play svg{width:100%;height:auto;display:block}.play figcaption{font-size:14.5px;margin-top:6px}.plegend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--soft);margin-top:4px}.plegend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}

.askbox{display:flex;flex-direction:column;gap:6px;margin-top:10px}.askbox textarea{width:100%;box-sizing:border-box;font:15.5px/1.4 var(--sans);padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);resize:vertical}.askbox .btn{align-self:flex-end;padding:10px 16px;font-size:15px}
.more.ask{margin-top:8px}.more summary .dot,.bar i.attn::after{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--coral);margin-right:8px;vertical-align:middle}.more.attn summary{font-weight:700;color:var(--coral)}
.bar i.attn{position:relative}.bar i.attn::after{content:'';position:absolute;top:-5px;right:-2px;margin:0;box-shadow:0 0 0 2px var(--bg)}
.draft{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--wash);margin-top:6px}.draft .body{margin-top:8px;font-size:15.5px}

.donestats{display:flex;justify-content:center;gap:22px;margin:14px 0 4px}.donestats div{display:flex;flex-direction:column;align-items:center}.donestats b{font:700 28px/1.1 var(--display)}.donestats span{font-size:13px;color:var(--soft)}.pb{font-weight:700;color:var(--persimmon);margin:6px 0 0}
.foot.navbar{margin:0 auto;position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:8px;max-width:560px;margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.foot.navbar .btn{padding:12px 10px}.navbar .btn.ghost{padding:12px 14px}.navbar .nb{min-width:48px}.navbar .btn:disabled{opacity:.35}
.bar{position:sticky;top:0;z-index:15;background:var(--bg);padding:8px 0 6px;margin-top:-8px}.bar i{height:8px;cursor:pointer}

.bar i{flex:1;height:6px;border-radius:6px;background:#DCE1E8;transition:background .3s}
.bar i.now{background:var(--ink)}
.card{background:var(--paper);border-radius:20px;padding:20px 18px 18px;border:1px solid rgba(29,39,64,.06);box-shadow:0 10px 28px rgba(29,39,64,.08);position:relative;overflow:hidden;animation:enter .22s ease-out}
@keyframes enter{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.card .band{position:absolute;left:0;top:0;right:0;height:5px}
.card .hd{display:flex;gap:12px;align-items:center;margin:4px 0 12px}
.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none}
.ic.k{font:700 23px var(--mincho)}
.card h2{margin:0;font-size:23px;line-height:1.15;font-weight:700}
.card .sub{color:var(--soft);font-size:14px;margin-top:3px}
.card p{margin:.5em 0}
.card ul{margin:.3em 0;padding-left:1.15em}.card li{margin:.25em 0}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--paper)}
.item .k{font-weight:600}
.item .m{color:var(--soft);font-size:14.5px}
.item.news{padding:13px 14px}
.nsum{margin:.45em 0;font-size:15.5px;line-height:1.55}
.nwhy{background:#F1EEFC;border-radius:9px;padding:8px 10px;margin-top:8px;font-size:14.5px}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;margin:0 4px 3px 0;background:var(--wash);color:var(--soft);border:1px solid var(--line)}
.empty{color:var(--soft)}
.foot{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border-radius:14px;padding:14px 10px;font-weight:700;font-size:16.5px;background:var(--sage);color:#fff;box-shadow:0 3px 0 #237449;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #237449}
.btn.ghost{flex:0 0 auto;padding:14px 18px;background:var(--paper);color:var(--soft);border:1px solid var(--line);box-shadow:0 3px 0 #E2E6EC}
.btn.sun{background:var(--persimmon);box-shadow:0 3px 0 #C4532A}
.btn.ink{background:var(--ink);box-shadow:0 3px 0 #0F1528}
.big{font:700 29px/1.15 var(--display);letter-spacing:-.02em;margin:.1em 0 .4em}
.focus{background:var(--persimmon-wash);border-radius:14px;padding:15px;margin:6px 0 16px}
.focus .lbl{font-size:14px;font-weight:600;color:var(--persimmon)}
.focus .one{font:700 21px/1.25 var(--display);margin:4px 0 6px}
.focus{border:1px solid #FFD9C6}
.focus .btn{flex:0 0 auto;padding:11px 16px;font-size:15px}
.wx{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.wx .temp{font:700 36px var(--display);letter-spacing:-.02em;color:var(--ai)}
.kanji{font:600 132px/1 var(--mincho);text-align:center;margin:10px 0 6px;color:var(--ink)}
.jp{font-family:var(--mincho)}
.center{text-align:center}
.label{width:100%;max-height:340px;object-fit:contain;background:var(--wash);border-radius:12px;display:block;margin:6px 0 12px}
.terms{display:grid;gap:6px;margin:10px 0}
.terms div{background:var(--wash);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:15px}
.hook{background:#EEF4FD;border-left:4px solid var(--ai);border-radius:10px;padding:10px 12px;margin:12px 0;font-weight:600}
.quiz{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.quiz h3{margin:0 0 4px;font-size:17px}
.q{margin:14px 0}
.q .qt{font-weight:600;margin-bottom:8px}
.q img{width:100%;max-height:220px;object-fit:contain;background:var(--wash);border-radius:10px;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid #D5DAE2;border-radius:10px;padding:11px 13px;margin:6px 0;font-weight:500;color:var(--ink)}
.opt.right{background:var(--sage-wash);border-color:var(--ok)}
.opt.wrong{background:#FBEAE8;border-color:var(--bad)}
.why{font-size:14.5px;background:var(--wash);border-radius:10px;padding:9px 11px;margin-top:6px;color:var(--ink)}
.score{font-weight:600;margin-top:8px}
.ov{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ov button{background:var(--paper);border-radius:12px;padding:13px 12px;text-align:left;border:1px solid var(--line);min-height:84px;position:relative}
.ov button.done{background:var(--sage-wash);border-color:#CFE3D6}
.ov .e{display:block;width:8px;height:8px;border-radius:50%}
.ov .n{font-weight:600;font-size:15px;line-height:1.25;display:block;margin-top:8px}.ov .m{font-size:13px;color:var(--soft)}
.lock{min-height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.lock img{width:96px;height:96px;border-radius:22px}
.lock h1{font-weight:600;font-size:26px}
.lock input{width:100%;max-width:340px;font:500 18px var(--sans);padding:13px;border-radius:12px;border:1px solid #CDD3DC;text-align:center;background:#fff;color:var(--ink)}
.lock .btn{max-width:340px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.timer{font-weight:600;font-size:40px;text-align:center;margin:8px 0 0;font-variant-numeric:tabular-nums;color:var(--persimmon)}
.fb{border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.fb .mu{font-weight:600;font-size:16.5px}
.fb .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fb .chip{color:var(--ink);font-weight:500;font-size:13.5px}
.bet{background:var(--persimmon-wash);border-radius:8px;padding:6px 9px;margin-top:7px;font-weight:600;font-size:14px}
.pick{background:#EAF0F8;border-radius:8px;padding:6px 9px;margin-top:7px;font-size:14px}
.done-wrap{text-align:center;padding:30px 10px}
.prog{display:grid;gap:8px;margin-top:10px}
.prog .row{display:flex;align-items:center;gap:8px;font-weight:500;font-size:15px}
.prog .track{flex:1;height:6px;background:#E4E8EE;border-radius:6px;overflow:hidden}
.prog .track{position:relative}
.prog .track i{position:absolute;left:0;top:0;display:block;height:100%;background:var(--sage)}
.prog .track i.lrn{background:color-mix(in srgb,var(--sage) 35%,#fff)}
.prog .n{font-size:13.5px;opacity:.75;white-space:nowrap;min-width:86px;text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:10px}
.ck{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:15px;cursor:pointer;user-select:none}
.ck input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid var(--persimmon);border-radius:6px;background:#fff;display:grid;place-content:center;margin:0;cursor:pointer}
.ck input:checked{background:var(--persimmon)}
.ck input:checked::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.picks button{border:1px solid #FFD9C6;background:#fff;border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
.fstat{font-size:14px;margin-top:8px}
/* glance → grasp → go deeper */
body{font-size:17px;line-height:1.6}
.card .sub{font-size:14.5px}
.item .m{font-size:15.5px;color:#4A5366}
.lead{font:650 20px/1.35 var(--display);letter-spacing:-.01em;margin:4px 0 12px;color:var(--ink)}
.pts{list-style:none;padding:0;margin:6px 0 4px;display:grid;gap:10px}
.pts li{position:relative;padding-left:22px;line-height:1.5;margin:0}
.pts li::before{content:'';position:absolute;left:3px;top:.62em;width:8px;height:8px;border-radius:3px;background:var(--dot,var(--ai))}
details.more{margin-top:12px;border-radius:12px;background:var(--wash);border:1px solid var(--line)}
details.more>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:600;font-size:15.5px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:'+';font:700 20px/1 var(--sans);color:var(--soft)}
details.more[open]>summary::after{content:'−'}
details.more>.in{padding:0 14px 12px;font-size:16.5px}
details.more>.in p:first-child{margin-top:0}
.facts{margin:12px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.facts .f{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:11px 13px;border-top:1px solid var(--line)}
.facts .f:first-child{border-top:0}
.facts .f .i{font-size:18px;line-height:1.4}
.facts .f b{display:block;font-size:13.5px;color:var(--soft);font-weight:600;line-height:1.3}
.facts .f span{font-size:16px;line-height:1.45}
.jpbox{margin-top:16px;background:#F3F6FC;border-radius:18px;padding:16px 15px}
.jphead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.jphead .n{font:700 30px/1 var(--display);color:var(--ai);letter-spacing:-.02em}
.jphead .t{font-weight:600;font-size:17px}
.jphead .clock{margin-left:auto;font-size:14px;color:var(--soft);white-space:nowrap}
.phrase{background:#fff;border-radius:14px;padding:16px;border:1px solid #DCE5F5;margin-top:12px}
.phrase .lbl{font-size:14px;font-weight:600;color:var(--ai)}
.phrase .say{font:600 23px/2 var(--mincho);margin:4px 0 0}
.phrase .say rt{font-size:.46em;font-family:var(--sans);font-weight:500;color:#6B7487}
.phrase .ro{font-size:14.5px;color:var(--soft);margin-top:2px}
.phrase .en{font-weight:600;font-size:17.5px;line-height:1.45;margin-top:8px}
.chunks{display:grid;gap:10px;margin-top:14px}
.chunks .c{border-left:4px solid var(--cc);padding:2px 0 2px 12px}
.chunks .c .jp{display:block;font-size:18.5px;font-weight:600;line-height:1.9}
.chunks .c .jp rt{font-size:.5em;font-family:var(--sans)}
.chunks .c span{font-size:15.5px;line-height:1.45;display:block}
.back{background:#FFF6E6;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:16px;line-height:1.55}
.back b{display:block;font-size:14px;color:#9A6A0B;margin-bottom:2px}
.wx2{display:flex;align-items:center;gap:14px;margin:16px 0 4px}
.wx2 .temp{font:700 44px/1 var(--display);color:var(--ai);letter-spacing:-.03em}
.wx2 .sky{font-weight:600;font-size:17px;line-height:1.35}
.wx2 .hl{font-size:14.5px;color:var(--soft)}
.wear{background:#EEF4FD;border-radius:12px;padding:11px 13px;margin-top:10px;font-size:16.5px}
.alert{background:#FFF1E6;border-left:4px solid var(--persimmon);border-radius:10px;padding:9px 12px;margin-top:8px;font-size:15.5px}
.focus .why{font-size:16px;color:#3B4458;line-height:1.55}
.news .hl{font:650 18.5px/1.3 var(--display);margin:4px 0 8px;letter-spacing:-.01em}
.news .pts li{font-size:16px}
.nwhy{background:#F1EEFC;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips span{background:var(--wash);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:14.5px;font-weight:500}
.pitch{background:#FBF0F4;border-radius:14px;padding:14px 15px;margin-top:14px;font-size:16.5px;line-height:1.6}
.pitch b{display:block;color:var(--plum);font-size:14px;margin-bottom:4px}
.money{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.money .v{font:700 40px/1 var(--display);letter-spacing:-.03em}
.delta{font-weight:700;font-size:15px;border-radius:999px;padding:3px 10px}
.delta.up{background:var(--sage-wash);color:#1F7445}.delta.dn{background:#FBE7E4;color:#B23A2F}
.stats{font-size:15px;color:var(--soft);margin-bottom:6px}
.sect{margin-top:18px}
.sect>h3{font-size:17px;margin:0 0 8px}
.bars{display:grid;gap:8px}
.bars .r{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:15.5px}
.bars .r .b{grid-column:1/-1;height:7px;border-radius:7px;background:#E7EBF1;overflow:hidden}
.bars .r .b i{display:block;height:100%;background:var(--teal);border-radius:7px}
.bars .r .v{font-variant-numeric:tabular-nums;color:var(--soft)}
.mix{display:flex;height:14px;border-radius:8px;overflow:hidden;margin:4px 0 8px}
.mixkey{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px}
.mixkey i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.ppl{display:grid;gap:8px}
.ppl .p{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:7px;font-size:16px}
.ppl .p:last-child{border-bottom:0}
.ppl .p small{color:var(--soft);font-size:14px;text-align:right}
.ppl .p .ms{color:var(--persimmon);font-weight:700}
.jwx{display:grid;gap:8px;margin-top:12px}
.jwx .c{background:#fff;border:1px solid #DCE5F5;border-radius:14px;padding:12px 14px}
.jwx .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.jwx .top b{font:650 17px var(--display)}.jwx .top span{font-size:13.5px;color:var(--soft)}
.jwx .now{display:flex;align-items:baseline;gap:6px;margin-top:2px}.jwx .now .t{font:700 26px/1.1 var(--display);color:var(--ai)}.jwx .now span{color:var(--soft)}
.jwx .sky{font-size:15.5px}

<body>
<canvas id="confetti"></canvas>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script>
var APP_BUILD='20261012130219';
var START='2026-10-09';            // day 0 — recall quizzes run every other day from here
var S={brief:null,state:null,key:null,i:0,mode:'flow',cards:[],quick:false};
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ls(k,v){try{if(v===undefined){var x=localStorage.getItem(k);return x?JSON.parse(x):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on')},2200)}
function todayPT(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles'}).format(new Date())}
function dayIdx(d){return Math.round((Date.parse(d)-Date.parse(START))/864e5)}
function shortDate(d){var x=new Date(d+'T12:00:00');return x.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function prettyDate(d){var x=new Date(d+'T12:00:00');return x.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}
function linkify(u,t){return u?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(t||'Open')+'</a>':''}

/* ---------- crypto ---------- */
function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function b64e(u){var s='';u=new Uint8Array(u);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
async function deriveKey(pass){
  var sj=await (await fetch('data/salt.json',{cache:'no-store'})).json();
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(sj.salt),iterations:sj.iter,hash:'SHA-256'},base,256);
  return b64e(bits);
}
async function importKey(raw){S.raw=raw;return crypto.subtle.importKey('raw',b64d(raw),'AES-GCM',false,['encrypt','decrypt'])}
async function decFile(path,v){
  var r=await fetch(path+'?v='+v,{cache:'no-store'});if(!r.ok)throw new Error('missing '+path);
  var j=await r.json();
  var p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(j.n)},S.key,b64d(j.c));
  return JSON.parse(new TextDecoder().decode(p));
}

/* ---------- progress (synced across devices) ---------- */
var P=ls('mb_prog')||{};          // itemId -> {box, wrong, last, t}
var DONE=ls('mb_done')||{};
var ANS=ls('mb_ans')||{};   // date -> {question text: chosen option}
var DAY=ls('mb_day')||{};   // date -> {start, right, total, combo, bestCombo, end}
var BEST=ls('mb_best')||{}; // {mins, pct}       // date -> {cardId: timestamp}
function record(id,right){
  var p=P[id]||{box:0,wrong:0,last:null};
  if(right){p.box=Math.min(4,p.box+1)}else{p.box=0;p.wrong++}
  p.last=todayPT();p.t=Date.now();P[id]=p;ls('mb_prog',P);queueSync();
}

/* Sync: progress is encrypted on the phone with the same key as the brief, then stored as
   ciphertext in Denise's "Morning Brief Sync" Google Sheet through its Apps Script web app. */
var SY={rev:0,timer:null,state:'off',dirty:false};
function syncURL(){return window.MB_SYNC_URL||''}
async function syncToken(){
  var a=b64d(S.raw),b=new TextEncoder().encode('mb-sync'),u=new Uint8Array(a.length+b.length);u.set(a);u.set(b,a.length);
  var h=new Uint8Array(await crypto.subtle.digest('SHA-256',u));
  return Array.prototype.map.call(h,function(x){return ('0'+x.toString(16)).slice(-2)}).join('');
}
async function encBlob(o){
  var n=crypto.getRandomValues(new Uint8Array(12));
  var c=await crypto.subtle.encrypt({name:'AES-GCM',iv:n},S.key,new TextEncoder().encode(JSON.stringify(o)));
  return JSON.stringify({n:b64e(n),c:b64e(c)});
}
async function decBlob(s){var j=JSON.parse(s);var p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(j.n)},S.key,b64d(j.c));return JSON.parse(new TextDecoder().decode(p))}
function mergeIn(r){
  var changed=false;
  Object.keys(r.P||{}).forEach(function(id){var x=r.P[id],y=P[id];if(!y||(x.t||0)>(y.t||0)){P[id]=x;changed=true}});
  Object.keys(r.DONE||{}).forEach(function(d){var x=r.DONE[d],y=DONE[d]=DONE[d]||{};Object.keys(x).forEach(function(c){if(!y[c]){y[c]=x[c];changed=true}})});
  ls('mb_prog',P);ls('mb_done',DONE);return changed;
}
function pruneDone(){var cut=new Date(Date.now()-120*864e5).toISOString().slice(0,10);Object.keys(DONE).forEach(function(d){if(d<cut)delete DONE[d]})}
function syncLabel(){return {off:'',ok:'· synced',busy:'· saving',err:'· offline'}[SY.state]||''}
function setSync(st){SY.state=st;var e=$('syncchip');if(e)e.textContent=syncLabel()}
/* every sync step runs one at a time, so quick answers never race each other */
var SQ=Promise.resolve();
function serial(fn){var r=SQ.then(fn,fn);SQ=r.catch(function(){});return r}
function pull(){return serial(pullNow)}
async function pullNow(){
  if(!syncURL()||!S.raw)return false;
  setSync('busy');
  var r=await (await fetch(syncURL()+'?token='+(await syncToken())+'&t='+Date.now())).json();
  if(!r.ok)throw new Error(r.error||'sync');
  SY.rev=r.rev||0;
  var changed=false,localExtra;
  if(r.blob){
    var remote=await decBlob(r.blob);changed=mergeIn(remote);
    localExtra=Object.keys(P).some(function(id){var x=(remote.P||{})[id];return !x||(P[id].t||0)>(x.t||0)})||
      Object.keys(DONE).some(function(d){return Object.keys(DONE[d]).some(function(c){return !((remote.DONE||{})[d]||{})[c]})});
  }else localExtra=Object.keys(P).length>0||Object.keys(DONE).length>0;
  setSync(SY.dirty?'busy':'ok');
  if(localExtra)queueSync(10);
  return changed;
}
function push(){clearTimeout(SY.timer);return serial(pushNow)}
async function pushNow(){
  if(!syncURL()||!S.raw)return;
  setSync('busy');
  try{
    for(var tries=0;tries<4;tries++){
      pruneDone();SY.dirty=false;
      var body=JSON.stringify({token:await syncToken(),base:SY.rev,blob:await encBlob({P:P,DONE:DONE,at:Date.now()})});
      var r=await (await fetch(syncURL(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body,keepalive:body.length<60000})).json();
      if(r.ok){SY.rev=r.rev;SY.fails=0;setSync(SY.dirty?'busy':'ok');return}
      if(!r.conflict)throw new Error(r.error||'sync');
      await pullNow();            // someone else saved first: merge theirs, then try again
    }
    throw new Error('conflict');
  }catch(e){
    SY.dirty=true;SY.fails=(SY.fails||0)+1;
    setSync(SY.fails>2?'err':'busy');      // quiet retries first; only warn if it keeps failing
    clearTimeout(SY.timer);SY.timer=setTimeout(push,Math.min(60000,3000*SY.fails));
  }
}
/* ---------- morning notifications from the mug icon ---------- */
function pushState(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!window.MB_PUSH_KEY||!syncURL())return 'unsupported';
  var standalone=window.navigator.standalone||window.matchMedia('(display-mode: standalone)').matches;
  if(!standalone)return 'install';
  if(Notification.permission==='denied')return 'denied';
  return ls('mb_push')?'on':'off';
}
async function enablePush(){
  try{
    var perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Notifications are off — you can allow them in Settings → Notifications.');render();return}
    var reg=await navigator.serviceWorker.ready;
    var sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64urlBytes(window.MB_PUSH_KEY)});
    var r=await (await fetch(syncURL(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:await syncToken(),sub:sub.toJSON()})})).json();
    if(!r.ok)throw new Error(r.error||'save');
    ls('mb_push',1);toast('Morning notifications are on');render();
  }catch(e){toast('Couldn\'t turn on notifications — try again in a minute.')}
}
function b64urlBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return b64d(s)}
function pushPanel(){
  var st=pushState();
  if(st==='on')return '<p class="small" style="margin-top:12px">Morning notifications are on for this phone.</p>';
  if(st==='off')return '<div class="foot" style="margin-top:12px"><button class="btn sun" onclick="enablePush()">Turn on morning notifications</button></div><p class="small">You\'ll get one notification from this app when your brief is ready, around 6:30.</p>';
  if(st==='install')return '<p class="small" style="margin-top:12px">To get morning notifications from this app, open it from its home-screen icon (Share → Add to Home Screen in Safari).</p>';
  if(st==='denied')return '<p class="small" style="margin-top:12px">Notifications are blocked for this app. Turn them on in iPhone Settings → Notifications → Morning Brief.</p>';
  return '';
}
function queueSync(ms){if(!syncURL())return;SY.dirty=true;clearTimeout(SY.timer);SY.timer=setTimeout(push,ms==null?1500:ms)}

function mastered(id){return (P[id]||{}).box>=3}

/* ---------- unlock ---------- */
function lockScreen(msg){
  $('app').innerHTML='<div class="lock"><img src="icons/icon-512.png" alt=""><h1 style="margin:6px 0 0">Good morning, Denise</h1>'+
  '<p class="small" style="max-width:320px">'+(msg?esc(msg):'Type your passphrase once and this phone remembers it.')+'</p>'+
  '<input id="pass" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="passphrase">'+
  '<button class="btn sun" id="go">Unlock my morning</button></div>';
  var go=async function(){
    var v=$('pass').value.trim().toLowerCase();if(!v)return;
    $('go').textContent='Brewing…';
    try{var raw=await deriveKey(v);S.key=await importKey(raw);await load(true);ls('mb_key',raw);syncNow()}
    catch(e){S.key=null;lockScreen('That passphrase didn\'t open it. Try again (dashes included).')}
  };
  $('go').onclick=go;$('pass').onkeydown=function(e){if(e.key==='Enter')go()};
}

/* ---------- load ---------- */
async function load(first,date){
  var lt=await (await fetch('data/latest.json?'+Date.now(),{cache:'no-store'})).json();
  if(lt.app&&lt.app!==APP_BUILD){var k='mb_reload_'+lt.app;try{if(!sessionStorage.getItem(k)){sessionStorage.setItem(k,'1');location.reload();return}}catch(e){}}
  var d=date||lt.date;
  S.state=await decFile('data/state.enc',lt.v);
  S.brief=await decFile('data/briefs/'+d+'.enc',lt.v);
  try{S.pb=await decFile('data/phrasebook.enc',lt.v)}catch(e){S.pb=S.pb||null}
  loadReplies();noteTZ();
  S.latest=lt;
  ls('mb_cache',{brief:S.brief,state:S.state,latest:lt,pb:S.pb});
  build();
}
async function boot(){
  var raw=ls('mb_key');
  if(!raw){lockScreen();return}
  S.key=await importKey(raw);
  try{await load()}catch(e){
    if(e&&e.name==='OperationError'){localStorage.removeItem('mb_key');lockScreen('Your passphrase changed — type the new one.');return}
    var c=ls('mb_cache');
    if(c&&c.brief){S.brief=c.brief;S.state=c.state;S.pb=c.pb||null;S.latest=c.latest;build();toast('Offline — showing your last brief')}
    else lockScreen('Couldn\'t load today\'s brief. Check your connection, or re-enter the passphrase.');
  }
  syncNow();
}
async function syncNow(){try{if(await pull()&&S.brief){if(!S.touched)S._landed=0;build()}}catch(e){SY.fails=(SY.fails||0)+1;setSync(SY.fails>2?'err':'busy');clearTimeout(SY.timer);SY.timer=setTimeout(syncNow,5000)}}

/* ---------- quiz engine ---------- */
var QN=0;
function quizHTML(items,title,onDoneKey){
  if(!items||!items.length)return '';
  var id='qz'+(QN++);
  window['_'+id]=items;
  var h='<div class="quiz" id="'+id+'" data-done="'+(onDoneKey||'')+'"><h3>'+esc(title||'Quick check')+'</h3>';
  items.forEach(function(q,i){
    h+='<div class="q" data-i="'+i+'">'+(q.img?'<img loading="lazy" src="'+esc(q.img)+'" alt="">':'')+
      '<div class="qt">'+(i+1)+'. '+esc(q.q)+'</div>';
    q.o.forEach(function(o,j){h+='<button class="opt" data-j="'+j+'">'+esc(o)+'</button>'});
    h+='</div>';
  });
  return h+'<div class="score"></div></div>';
}
function wireQuizzes(root){
  root.querySelectorAll('.quiz').forEach(function(z){
    var items=window['_'+z.id];var answered=0,right=0;
    z.querySelectorAll('.q').forEach(function(qd){
      var q=items[+qd.dataset.i];
      qd.querySelectorAll('.opt').forEach(function(b){
        b.onclick=function(ev,restore){
          if(qd.dataset.ans)return;qd.dataset.ans=1;
          var j=+b.dataset.j,ok=j===q.a;
          if(!restore){var A=ANS[S.brief.date]=ANS[S.brief.date]||{};A[q.q]=j;ls('mb_ans',ANS);dayHit(ok)}
          b.classList.add(ok?'right':'wrong');
          if(!ok)qd.querySelectorAll('.opt')[q.a].classList.add('right');
          if(q.w){var w=document.createElement('div');w.className='why';w.innerHTML=esc(q.w);qd.appendChild(w);furi(w)}
          if(q.id&&!restore)record(q.id,ok);
          answered++;if(ok)right++;
          if(navigator.vibrate&&!restore)navigator.vibrate(ok?15:[30,40,30]);
          if(answered===items.length){
            z.querySelector('.score').textContent=right===items.length?right+'/'+items.length+' — perfect.':right+'/'+items.length+' — misses come back in your next quiz.';
            if(right===items.length&&!restore)burst(40);
          }
        };
      });
      var prev=(ANS[S.brief.date]||{})[q.q];
      if(prev!=null){var pb=qd.querySelectorAll('.opt')[prev];if(pb)pb.onclick(null,true)}
    });
  });
}
function withIds(sec,track){
  // lesson quiz items carry the same ids the publisher stored, so answers feed the recall pool
  var pool=(S.state&&S.state.pool)||{};
  return (sec.quiz||[]).map(function(q){
    for(var k in pool){var p=pool[k];if(p.track===track&&p.q===q.q&&p.date===S.brief.date)return Object.assign({},q,{id:p.id})}
    return q;
  });
}
function recallItems(kind){
  var pool=Object.values((S.state&&S.state.pool)||{}),d=S.brief.date;
  if(kind==='sunday'){
    var wk=Date.parse(d)-7*864e5;
    return shuffle(pool.filter(function(p){return p.track==='kanji'&&Date.parse(p.date)>wk&&p.date<=d})).slice(0,14);
  }
  var older=pool.filter(function(p){return p.date<d&&!mastered(p.id)});
  var missed=older.filter(function(p){return (P[p.id]||{}).wrong>0});
  if(kind==='second')return shuffle(missed).slice(0,5);
  missed.sort(function(a,b){return ((P[b.id]||{}).wrong||0)-((P[a.id]||{}).wrong||0)});
  var rest=older.filter(function(p){return missed.indexOf(p)<0}).sort(function(a,b){return a.date<b.date?-1:1});
  // bottles + WSET lead the recall quiz; language, kanji and markets fill in
  var lead=rest.filter(function(p){return p.track==='bottle'||p.track==='wset'});
  var fill=rest.filter(function(p){return lead.indexOf(p)<0});

var NUMK='一二三四五六七八九十百千万';
function learnedSet(){
  var set={},d=S.brief&&S.brief.date;
  NUMK.split('').forEach(function(c){set[c]=1});
  ((S.state&&S.state.taught&&S.state.taught.kanji)||[]).forEach(function(x){if(!d||x.date<=d)(x.ref||'').replace(/[\u4e00-\u9fff]/g,function(c){set[c]=1})});
  return set;
}
function furi(root){
  if(!root)return;var have=learnedSet(),re=/\{([^{}|]+)\|([^{}]*)\}/g;
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),nodes=[],n;
  while(n=w.nextNode()){if(n.nodeValue.indexOf('{')>-1&&n.nodeValue.indexOf('|')>-1)nodes.push(n)}
  nodes.forEach(function(t){
    var txt=t.nodeValue,frag=document.createDocumentFragment(),last=0,m;re.lastIndex=0;
    while(m=re.exec(txt)){
      if(m.index>last)frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
      var base=m[1],rd=m[2],need=rd&&rd!=='-'&&(base.match(/[\u4e00-\u9fff\u3005]/g)||[]).some(function(c){return !have[c]});
      if(need){var r=document.createElement('ruby');r.appendChild(document.createTextNode(base));var rt=document.createElement('rt');rt.textContent=rd;r.appendChild(rt);frag.appendChild(r)}
      else frag.appendChild(document.createTextNode(base));
      last=re.lastIndex;
    }
    if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last)));
    t.parentNode.replaceChild(frag,t);
  });
}

/* ---------- football play diagrams: offense (O, circles) at the bottom, defense (D, X's) at the top; LOS at y=0, y = yards downfield ---------- */
function playSVG(d){
  if(!d||!(d.players||[]).length)return '';
  var W=340,H=230,ymin=d.ymin!=null?d.ymin:-8,ymax=d.ymax!=null?d.ymax:14;
  var X=function(x){return 12+x/100*(W-24)},Y=function(y){return H-14-(y-ymin)/(ymax-ymin)*(H-28)};
  var g='';
  for(var yd=Math.ceil(ymin/5)*5;yd<=ymax;yd+=5)if(yd!==0)g+='<line x1="8" x2="'+(W-8)+'" y1="'+Y(yd)+'" y2="'+Y(yd)+'" stroke="currentColor" stroke-opacity=".12"/>';
  g+='<line x1="8" x2="'+(W-8)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="#2E6FD6" stroke-width="2" stroke-dasharray="6 4"/>';

    var path=pts.map(function(q,i){return (i?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)}).join(' '),c=col[r.style]||col.pass;
    g+='<path d="'+path+'" fill="none" stroke="'+c+'" stroke-width="2.4" '+(r.style==='motion'||r.style==='coverage'?'stroke-dasharray="5 4" ':'')+'marker-end="url(#ah-'+(r.style||'pass')+')"/>';});
  d.players.forEach(function(p){var x=X(p.x),y=Y(p.y);
    if(p.side==='D')g+='<g stroke="#1D2740" stroke-width="2.4"><line x1="'+(x-6)+'" y1="'+(y-6)+'" x2="'+(x+6)+'" y2="'+(y+6)+'"/><line x1="'+(x+6)+'" y1="'+(y-6)+'" x2="'+(x-6)+'" y2="'+(y+6)+'"/></g>'+(p.label?'<text x="'+x+'" y="'+(y-10)+'" text-anchor="middle" font-size="10" fill="currentColor">'+esc(p.label)+'</text>':'');
    else g+='<circle cx="'+x+'" cy="'+y+'" r="'+(p.label&&p.label.length>2?11:9)+'" fill="'+(p.hi?'#FFE3B3':'#fff')+'" stroke="#1D2740" stroke-width="2"/>'+(p.label?'<text x="'+x+'" y="'+(y+3.5)+'" text-anchor="middle" font-size="'+(p.label.length>2?8:9.5)+'" font-weight="700" fill="#1D2740">'+esc(p.label)+'</text>':'');});
  var mk=Object.keys(col).map(function(k){return '<marker id="ah-'+k+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="'+col[k]+'"/></marker>'}).join('');
  var legend=(d.routes||[]).map(function(r){return r.style||'pass'}).filter(function(v,i,a){return a.indexOf(v)===i}).map(function(k){return '<span><i style="background:'+(col[k]||col.pass)+'"></i>'+({pass:'pass route',run:'run',block:'block',motion:'motion',coverage:'coverage'}[k]||k)+'</span>'}).join('');
  return '<figure class="play"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(d.caption||'Play diagram')+'"><defs>'+mk+'</defs>'+g+'</svg>'+(legend?'<div class="plegend"><span><b style="color:#2E6FD6">- - -</b> line of scrimmage</span>'+legend+'</div>':'')+(d.caption?'<figcaption>'+esc(d.caption)+'</figcaption>':'')+'</figure>';
}

  if(u.n&&S._nudged!==S.i){S._nudged=S.i;u.first.scrollIntoView({behavior:'smooth',block:'center'});toast(u.n+' question'+(u.n>1?'s':'')+' left here. Finish '+(u.n>1?'them':'it')+' to lock it in, or tap Got it again to move on.');return}
  S._nudged=null;S.touched=1;dayStat();mark();burst(10);S.i++;
  var cs=visible(),done=DONE[S.brief.date]||{},n=cs.filter(function(c){return done[c.id]}).length;
  if(n===Math.ceil(cs.length/2))cheer('Halfway there!',50);
  else if(cs.length-n===3)cheer('3 cards to go!',30);
  render()}
function later(){S.touched=1;var cs=visible();if(S.quick){S.i++;render();return}var c=S.cards.splice(S.cards.indexOf(cs[S.i]),1)[0];S.cards.push(c);render();toast('Saved it for later')}
function finish(){
  var done=DONE[S.brief.date]||{},left=S.cards.filter(function(c){return !done[c.id]});
  burst(160);
  var t=dayStat();if(!left.length&&!t.end){t.end=Date.now();ls('mb_day',DAY)}
  var m=mins(),pct=t.total?Math.round(t.right/t.total*100):null,pb=[];
  if(!left.length&&t.total){if(!BEST.pct||pct>BEST.pct){if(BEST.pct)pb.push('best accuracy yet');BEST.pct=pct}if(!BEST.mins||m<BEST.mins){if(BEST.mins)pb.push('fastest finish yet');BEST.mins=m}ls('mb_best',BEST)}
  var stats='<div class="donestats"><div><b>'+m+'</b><span>minutes</span></div>'+(pct!=null?'<div><b>'+pct+'%</b><span>right</span></div>':'')+(t.bestCombo?'<div><b>'+t.bestCombo+'</b><span>best streak</span></div>':'')+'</div>'+(pb.length?'<p class="pb">New personal record: '+pb.join(' and ')+'!</p>':'');
  $('app').innerHTML=header()+'<div class="card done-wrap"><img src="icons/icon-192.png" alt="" style="width:72px;height:72px;border-radius:16px;margin-bottom:6px"><div class="big">'+(left.length?'Musts done!':'Brief complete!')+'</div><p>'+(left.length?left.length+' cards are waiting whenever you want them.':'You showed up for yourself this morning. That counts.')+'</p>'+stats+'<div class="foot">'+(left.length?'<button class="btn sun" onclick="setMode(\'flow\',false)">Keep going</button>':'')+'<button class="btn ink" onclick="setMode(\'all\',false)">Overview</button></div></div>'+extras();furi($('app'));
}
async function openDay(d){try{S.brief=await decFile('data/briefs/'+d+'.enc',S.latest.v);S._landed=0;S.mode='flow';S.quick=false;build()}catch(e){toast('Couldn\'t open that day')}}
async function refresh(){toast('Checking for a fresh brief…');try{S._landed=0;await checkBuild();await load();toast('Up to date')}catch(e){toast('Offline — try again soon')}}
function tickJST(){var e=$('jst');if(!e)return;e.textContent=new Date().toLocaleTimeString('en-US',{timeZone:'Asia/Tokyo',hour:'numeric',minute:'2-digit'})}
setInterval(tickJST,30000);
var SPR=null;
/* check-offs for the one thing and each "Needs you" email: Done / Remind me later (app notification) / Add to Google Calendar */
var TK={};
function fkeyDate(){return S.brief.date}
function tState(k){var x=(DONE[fkeyDate()]||{}),best={s:'',t:0};Object.keys(x).forEach(function(n){if(n.slice(0,2)==='f_'){var v=x[n];if(v&&(v.k||'focus')===k&&(v.t||0)>best.t)best=v}});return best}
function focusState(){return tState('focus')}
/* shopping list: add/check/remove events kept in DONE.shop, so they sync across devices like everything else */
function shopEv(o){o.k='shop';o.t=Date.now();var d=DONE.shop=DONE.shop||{};d['f_'+o.t+'_'+Math.random().toString(36).slice(2,6)]=o;ls('mb_done',DONE);queueSync(300)}
function shopList(){var ev=Object.keys(DONE.shop||{}).map(function(k){return DONE.shop[k]}).filter(function(e){return e&&e.k==='shop'}).sort(function(a,b){return (a.t||0)-(b.t||0)}),m={},order=[];
  ev.forEach(function(e){if(e.a==='add'){if(!m[e.id])order.push(e.id);m[e.id]={id:e.id,text:e.text,got:0,del:0,t:e.t}}else if(m[e.id]){if(e.a==='got')m[e.id].got=e.t;if(e.a==='undo')m[e.id].got=0;if(e.a==='del')m[e.id].del=1}});
  var cut=Date.now()-18*36e5;return order.map(function(id){return m[id]}).filter(function(x){return !x.del&&(!x.got||x.got>cut)})}
function shopKnown(id){return Object.keys(DONE.shop||{}).some(function(k){var e=DONE.shop[k];return e&&e.id===id})}
function shopSeed(items){(items||[]).forEach(function(it){var id=it.id||('b:'+String(it.text||it).toLowerCase());if(!shopKnown(id))shopEv({a:'add',id:id,text:it.text||String(it)})})}
function shopHTML(){var L=shopList(),open=L.filter(function(x){return !x.got}).length;
  return '<div class="shop" id="shopbox"><h3 class="comehead">Shopping list'+(open?' ('+open+')':'')+'</h3>'+(L.length?L.map(function(x){return '<label class="si'+(x.got?' got':'')+'"><input type="checkbox" '+(x.got?'checked ':'')+'onchange="shopTog(\''+esc(x.id)+'\',this.checked)"><span>'+esc(x.text)+'</span><button type="button" aria-label="Remove '+esc(x.text)+'" onclick="event.preventDefault();shopDel(\''+esc(x.id)+'\')">×</button></label>'}).join(''):'<p class="empty">Nothing on the list. Add things here as you think of them.</p>')+
  '<div class="sadd"><input id="shopin" placeholder="Add something to buy" enterkeyhint="done" onkeydown="if(event.key===\'Enter\'){event.preventDefault();shopAdd()}"><button type="button" class="btn ghost" onclick="shopAdd()">Add</button></div></div>'}
function shopRefresh(){var b=$('shopbox');if(b)b.outerHTML=shopHTML()}
function shopAdd(){var i=$('shopin'),v=(i&&i.value||'').trim();if(!v)return;shopEv({a:'add',id:'u'+Date.now().toString(36),text:v.slice(0,80)});shopRefresh();var n=$('shopin');if(n)n.focus()}
function shopTog(id,on){shopEv({a:on?'got':'undo',id:id});if(on)cheer('Got it!',10);shopRefresh()}
function shopDel(id){shopEv({a:'del',id:id});shopRefresh()}
function tEvent(k,o){o.k=k;o.t=Date.now();var d=DONE[fkeyDate()]=DONE[fkeyDate()]||{};d['f_'+o.t]=o;ls('mb_done',DONE);queueSync(300)}
function fmtTime(iso){return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
function tStatus(k){
  var f=tState(k),cal=f.cal?' <a href="'+esc(f.cal)+'" target="_blank" rel="noopener">'+(f.s==='cal'?'Open it again':'Add it to Google Calendar')+'</a>':'';
  if(f.s==='done')return k==='focus'?'<b>Done.</b> That was the one that mattered today.':'<b>Done.</b>';
  if(f.s==='later'&&f.at)return (Date.parse(f.at)>Date.now()?'Reminder set for <b>'+fmtTime(f.at)+'</b>.':'Your <b>'+fmtTime(f.at)+'</b> reminder has passed. Still on your plate?')+cal;
  if(f.s==='cal'&&f.at)return 'On your Google Calendar for <b>'+fmtTime(f.at)+'</b>.'+cal;
  return '';
}
function tChecks(k,title,step,lead){
  TK[k]={title:title,step:step||''};var s=tState(k).s;
  var box=function(kind,label,on){return '<label class="ck"><input type="checkbox" id="tk-'+kind+'-'+k+'" onchange="tToggle(\''+k+'\',\''+kind+'\',this.checked)"'+(on?' checked':'')+'>'+label+'</label>'};
  return '<div class="frow">'+(lead||'')+box('done','Done',s==='done')+box('later','Remind me later',s==='later')+box('cal','Add to Google Calendar',s==='cal')+'</div><div id="tk-pick-'+k+'"></div><div class="fstat" id="tk-stat-'+k+'">'+tStatus(k)+'</div>';
}
function tRefresh(k){var s=tState(k).s;['done','later','cal'].forEach(function(x){var e=$('tk-'+x+'-'+k);if(e)e.checked=s===x});var st=$('tk-stat-'+k);if(st)st.innerHTML=tStatus(k)}
async function remindCall(o){if(!syncURL())return null;try{var body=JSON.stringify(Object.assign({token:await syncToken()},o));return await (await fetch(syncURL(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body})).json()}catch(e){return null}}
function tToggle(k,kind,on){
  var pk=$('tk-pick-'+k);pk.innerHTML='';
  if(!on){tEvent(k,{s:'undo'});remindCall({cancel:fkeyDate(),key:k});tRefresh(k);return}
  ['done','later','cal'].forEach(function(x){if(x!==kind){var e=$('tk-'+x+'-'+k);if(e)e.checked=false}});
  if(kind==='done'){tEvent(k,{s:'done'});burst(k==='focus'?60:30);if(navigator.vibrate)navigator.vibrate(20);remindCall({cancel:fkeyDate(),key:k});tRefresh(k);return}
  var now=new Date(),opts=[['In 1 hour',new Date(Date.now()+36e5)]];
  [[12,'Noon'],[14,'2 PM'],[17,'5 PM'],[20,'8 PM']].forEach(function(h){var d=new Date(now);d.setHours(h[0],0,0,0);if(d-now>30*6e4)opts.push([h[1],d])});
  var tm=new Date(now);tm.setDate(tm.getDate()+1);tm.setHours(10,0,0,0);opts.push(['Tomorrow 10 AM',tm]);
  if(kind==='later')opts=opts.filter(function(o){return o[1]-now<20*36e5});
  window['_opts_'+k]=opts;
  pk.innerHTML='<div class="small" style="margin-top:8px">'+(kind==='later'?'When should I remind you?':'Put it on your calendar for:')+'</div><div class="picks">'+opts.map(function(o,i){return '<button onclick="tPick(\''+k+'\',\''+kind+'\','+i+')">'+o[0]+'</button>'}).join('')+'</div>';
}
function plainText(t){return String(t||'').replace(/\{([^{}|]+)\|[^{}]*\}/g,'$1')}
function calLink(k,at){
  var t=TK[k]||{},f=function(d){return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')},e=new Date(at.getTime()+15*6e4);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(plainText(t.title||'Morning Brief to-do'))+'&dates='+f(at)+'/'+f(e)+'&details='+encodeURIComponent(plainText(t.step||'')+'\n\nFrom your Morning Brief.');
}
async function tPick(k,kind,i){
  var at=window['_opts_'+k][i][1],pk=$('tk-pick-'+k),link=calLink(k,at);
  if(kind==='cal'){window.open(link,'_blank','noopener');tEvent(k,{s:'cal',at:at.toISOString(),cal:link});remindCall({cancel:fkeyDate(),key:k});pk.innerHTML='';tRefresh(k);return}
  pk.innerHTML='<div class="small" style="margin-top:8px">Setting it…</div>';
  var r=pushState()==='on'?await remindCall({remind:{date:fkeyDate(),at:at.toISOString(),key:k}}):null;
  var ok=!!(r&&r.reminded>0);
  tEvent(k,{s:'later',at:at.toISOString(),cal:ok?'':link});
  pk.innerHTML='';tRefresh(k);
  toast(ok?'I\'ll nudge you at '+fmtTime(at.toISOString()):'Tap “Add it to Google Calendar” so your phone reminds you');
}
function sprint(){
  var el=$('sprint');if(!el)return;clearInterval(SPR);var end=Date.now()+300000;
  var t=function(){var s=Math.max(0,Math.round((end-Date.now())/1000));el.innerHTML='<div class="timer">'+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'</div>';if(!s){clearInterval(SPR);el.innerHTML='<div class="timer">Sprint done.</div>';burst(80);if(navigator.vibrate)navigator.vibrate([80,60,80])}};
  t();SPR=setInterval(t,1000);
}
/* confetti */
function burst(n){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cv=$('confetti'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  var cols=['#EC6A3A','#3070D0','#2F9460','#D29A1B','#B3366A','#6A57D6','#17998C'],ps=[];
  for(var i=0;i<n;i++)ps.push({x:innerWidth/2,y:innerHeight*.7,vx:(Math.random()-.5)*14,vy:-Math.random()*16-6,c:cols[i%cols.length],s:Math.random()*7+4,r:Math.random()*6});
  var f=0;(function a(){x.clearRect(0,0,cv.width,cv.height);ps.forEach(function(p){p.vy+=.5;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<90)requestAnimationFrame(a);else x.clearRect(0,0,cv.width,cv.height)})();
}
/* updates: new build → reload shell */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
document.addEventListener('visibilitychange',function(){if(document.hidden&&SY.dirty){push()}if(!document.hidden&&S.key){syncNow()}if(!document.hidden&&S.latest){fetch('data/latest.json?'+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(lt){if(lt.v!==S.latest.v){S._landed=0;load()}}).catch(function(){})}});
boot();
</script>
